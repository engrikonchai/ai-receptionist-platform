name: Verify

# Runs the same local verification suite (test/typecheck/lint/format/build)
# on every pull request and every push to main. Deliberately requires and
# exposes NO secrets — no Paddle, Supabase, or other production
# credentials are configured here, and none are needed: every command
# below (including `bun run build`) succeeds against this repository with
# zero environment variables set, since every server-only integration in
# this app (Supabase, Paddle) fails closed to a safe "not configured"
# state rather than throwing when its env vars are absent. Never add a
# production secret to this workflow.
on:
  pull_request:
  push:
    branches:
      - main

# Read-only by default — this workflow only checks out code and runs
# local commands; it never needs to write to the repo, open PRs/issues,
# or call any GitHub API beyond reading the checkout.
permissions:
  contents: read

# A new push to the same PR/branch cancels any run already in progress
# for it, so superseded commits never keep consuming runner time.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, lint, format, build
    runs-on: ubuntu-latest
    # Generous but bounded — a cold-cache CI run of the full suite plus
    # a production build is expected to finish well under this.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # No `.bun-version`/`packageManager` field exists in this repo
          # to read from — pinned to the version this repository is
          # actually developed and its bun.lock produced with, so CI
          # never silently drifts onto a newer/older Bun than what's
          # verified locally.
          bun-version: '1.3.11'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run unit/integration tests
        run: bun run test

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Production build
        run: bun run build
